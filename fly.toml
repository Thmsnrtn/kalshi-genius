# fly.toml app configuration file generated for kalshi-genius on 2026-04-06T20:09:38-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kalshi-genius'
primary_region = 'ewr'

[build]

[env]
  BANKROLL = '25'
  DASHBOARD_PORT = '3000'
  DB_PATH = '/data/polybot.db'
  KALSHI_ENV = 'production'
  KALSHI_PRIVATE_KEY_PATH = '/data/kalshi_private_key.pem'

[processes]
  app = 'bun run src/index.ts'

[[mounts]]
  source = 'polybot_data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']
