app = "polymarket-genius"
primary_region = "ewr"

[build]

[env]
  DRY_RUN = "true"
  BANKROLL = "25"
  DASHBOARD_PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "bun run src/index.ts"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[mounts]
  source = "polybot_data"
  destination = "/data"
  processes = ["app"]
